name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify

      - name: Run golangci-lint
        run: golangci-lint run

      - name: go vet
        run: go vet ./...

      # Generate the .syso files here too, so a malformed winres.json fails on the
      # PR rather than on a pushed tag.  Versions stay at 0.0.0.0 — only release.yml
      # stamps the real ones.  Keep the pin in sync with release.yml and the
      # //go:generate directive in cmd/wtop/main.go.
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Embed Windows resources
        run: go-winres make --arch amd64,arm64 --in cmd/wtop/winres/winres.json --out cmd/wtop/rsrc

      # -s -w deliberately omitted here as in release.yml; see the comment there.
      - name: Build (windows/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath ./cmd/wtop/

      - name: Build (windows/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go build -trimpath ./cmd/wtop/

      - name: go test
        run: go test ./...

