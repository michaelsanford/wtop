name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Replaces the workflow-level `paths-ignore` that used to sit on both
  # triggers. A workflow skipped by a path filter never reports its check
  # contexts, so the ruleset's required checks stayed pending for ever and a
  # docs-only pull request could never be merged. A job skipped by `if:`
  # reports success instead, which does satisfy the ruleset.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Decide whether the rest of the workflow needs to run
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...HEAD"
          else
            range="$BEFORE_SHA..HEAD"
          fi

          # Anything unexpected - a first push, a force push, a pruned object -
          # runs the full workflow rather than silently skipping it.
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "Could not diff $range; running the workflow."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) continue ;;
            esac
            echo "relevant change: $f"
            code=true
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "true" ] || echo "Only ignored paths changed; downstream jobs will skip."

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify

      - name: Run golangci-lint
        run: golangci-lint run

      - name: go vet
        run: go vet ./...

      # Generate the .syso files here too, so a malformed winres.json fails on the
      # PR rather than on a pushed tag.  Versions stay at 0.0.0.0 — only release.yml
      # stamps the real ones.  Keep the pin in sync with release.yml and the
      # //go:generate directive in cmd/wtop/main.go.
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Embed Windows resources
        run: go-winres make --arch amd64,arm64 --in cmd/wtop/winres/winres.json --out cmd/wtop/rsrc

      # -s -w deliberately omitted here as in release.yml; see the comment there.
      - name: Build (windows/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath ./cmd/wtop/

      - name: Build (windows/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go build -trimpath ./cmd/wtop/

      - name: go test
        run: go test ./...

